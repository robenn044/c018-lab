merge_protections_settings:
  auto_merge_conditions: true

merge_protections:
  - name: require-review-and-ci
    if:
      - base = main
    success_conditions:
      - "#approved-reviews-by >= 1"
      - check-success = ci

  - name: green-on-release
    if:
      - base = release
    success_conditions:
      - check-success = ci

pull_request_rules:
  - name: automatic approval
    conditions:
      - base = release
    actions:
      review:
        type: APPROVE

  - name: copy release work to the maintenance branch
    conditions:
      - base = release
    actions:
      copy:
        branches:
          - maintenance
